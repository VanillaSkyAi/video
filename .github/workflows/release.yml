name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  repository-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Verify release repository identity
        env:
          EXPECTED_REPOSITORY: VanillaSkyAi/video
        run: |
          if [[ "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" ]]; then
            echo "Release tags are accepted only in $EXPECTED_REPOSITORY; received $GITHUB_REPOSITORY" >&2
            exit 1
          fi

  verify:
    needs: repository-identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact-filename: ${{ steps.artifact.outputs.filename }}
      integrity: ${{ steps.artifact.outputs.integrity }}
      name: ${{ steps.artifact.outputs.name }}
      prerelease: ${{ steps.artifact.outputs.prerelease }}
      sha256: ${{ steps.artifact.outputs.sha256 }}
      version: ${{ steps.artifact.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # checkout fetches the peeled event SHA back into refs/tags/<name>,
      # replacing the annotated tag object that the first full fetch obtained.
      - name: Restore annotated release tag object
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git fetch --force origin main:refs/remotes/origin/main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"

      - name: Install the locked npm CLI
        run: npm install --global npm@11.17.0
      - run: npm ci

      # CI already ran lint, types, tests, and consumer verification on this
      # commit; this step only packs it and proves tag/source/tarball agree.
      - name: Build release artifact
        id: artifact
        env:
          VANILLASKY_APPROVED_BRANCH: origin/main
          VANILLASKY_RELEASE_OUTPUT_DIR: release-assets
        run: npm run release:build -- --ci

      - name: Upload verified release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ steps.artifact.outputs.version }}
          path: release-assets
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    outputs:
      already-published: ${{ steps.registry.outputs.already-published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          registry-url: https://registry.npmjs.org
      - name: Install npm CLI with trusted publishing support
        run: npm install --global npm@11.17.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-${{ needs.verify.outputs.version }}
          path: release-assets

      - name: Verify exact release artifact
        env:
          VANILLASKY_PACKED_TARBALL: ./release-assets/${{ needs.verify.outputs.artifact-filename }}
          VANILLASKY_EXPECTED_INTEGRITY: ${{ needs.verify.outputs.integrity }}
          VANILLASKY_EXPECTED_SHA256: ${{ needs.verify.outputs.sha256 }}
        run: node scripts/verify-release-integrity.mjs file "$VANILLASKY_PACKED_TARBALL" "$VANILLASKY_EXPECTED_INTEGRITY" "$VANILLASKY_EXPECTED_SHA256"

      - name: Check immutable npm version
        id: registry
        run: |
          if npm view "${{ needs.verify.outputs.name }}@${{ needs.verify.outputs.version }}" version >/dev/null 2>&1; then
            node scripts/verify-release-integrity.mjs registry "${{ needs.verify.outputs.name }}@${{ needs.verify.outputs.version }}" "${{ needs.verify.outputs.integrity }}"
            echo "already-published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify npm dist-tag transition
        if: steps.registry.outputs.already-published != 'true'
        run: |
          if [[ "${{ needs.verify.outputs.prerelease }}" == "true" ]]; then
            release_tag=beta
          else
            release_tag=latest
          fi
          node scripts/verify-release-integrity.mjs dist-tags-transition "${{ needs.verify.outputs.name }}" "${{ needs.verify.outputs.version }}" "$release_tag"

      - name: Publish stable package with trusted provenance
        if: steps.registry.outputs.already-published != 'true' && needs.verify.outputs.prerelease == 'false'
        run: npm publish "./release-assets/${{ needs.verify.outputs.artifact-filename }}" --provenance --access public --tag latest

      - name: Publish prerelease package with trusted provenance
        if: steps.registry.outputs.already-published != 'true' && needs.verify.outputs.prerelease == 'true'
        run: npm publish "./release-assets/${{ needs.verify.outputs.artifact-filename }}" --provenance --access public --tag beta

      - name: Verify npm artifact identity
        run: |
          node scripts/verify-release-integrity.mjs registry "${{ needs.verify.outputs.name }}@${{ needs.verify.outputs.version }}" "${{ needs.verify.outputs.integrity }}"
          if [[ "${{ needs.verify.outputs.prerelease }}" == "true" ]]; then
            release_tag=beta
          else
            release_tag=latest
          fi
          node scripts/verify-release-integrity.mjs dist-tags "${{ needs.verify.outputs.name }}" "${{ needs.verify.outputs.version }}" "$release_tag"

  verify-published:
    needs: [verify, publish-npm]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
      options: --init --ipc=host --user pwuser
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
      - name: Install the locked npm CLI
        run: npm install --global npm@11.17.0
      - run: npm ci

      - name: Verify published npm package
        env:
          VANILLASKY_PUBLISHED_VERSION: ${{ needs.verify.outputs.version }}
          VANILLASKY_EXPECTED_INTEGRITY: ${{ needs.verify.outputs.integrity }}
          VANILLASKY_EVIDENCE_DIR: artifacts/release-verification
        run: npm run verify:published

      - name: Upload release verification evidence
        if: ${{ always() && hashFiles('artifacts/release-verification/**') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-verification-evidence-${{ needs.verify.outputs.version }}
          path: artifacts/release-verification
          if-no-files-found: error

  publish-github-release:
    needs: [verify, verify-published]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-${{ needs.verify.outputs.version }}
          path: release-assets

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VANILLASKY_PACKED_TARBALL: ./release-assets/${{ needs.verify.outputs.artifact-filename }}
          VANILLASKY_EXPECTED_INTEGRITY: ${{ needs.verify.outputs.integrity }}
          VANILLASKY_EXPECTED_SHA256: ${{ needs.verify.outputs.sha256 }}
          VANILLASKY_EXPECTED_PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          node scripts/verify-release-integrity.mjs file "$VANILLASKY_PACKED_TARBALL" "$VANILLASKY_EXPECTED_INTEGRITY" "$VANILLASKY_EXPECTED_SHA256"
          tag_commit=$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "Annotated tag resolves to $tag_commit, expected $GITHUB_SHA" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            node scripts/verify-github-release.mjs "$GITHUB_REF_NAME" release-assets/RELEASE_NOTES.md "$VANILLASKY_EXPECTED_PRERELEASE" "$GITHUB_SHA" main
            mkdir existing-release
            if gh release download "$GITHUB_REF_NAME" --pattern "${{ needs.verify.outputs.artifact-filename }}" --dir existing-release; then
              node scripts/verify-release-integrity.mjs file "existing-release/${{ needs.verify.outputs.artifact-filename }}" "$VANILLASKY_EXPECTED_INTEGRITY" "$VANILLASKY_EXPECTED_SHA256"
            else
              echo "Existing release is missing the immutable candidate asset" >&2
              exit 1
            fi
          else
            if [[ "$VANILLASKY_EXPECTED_PRERELEASE" == "true" ]]; then
              gh release create "$GITHUB_REF_NAME" "$VANILLASKY_PACKED_TARBALL" --verify-tag --notes-file release-assets/RELEASE_NOTES.md --target main --prerelease
            else
              gh release create "$GITHUB_REF_NAME" "$VANILLASKY_PACKED_TARBALL" --verify-tag --notes-file release-assets/RELEASE_NOTES.md --target main
            fi
            node scripts/verify-github-release.mjs "$GITHUB_REF_NAME" release-assets/RELEASE_NOTES.md "$VANILLASKY_EXPECTED_PRERELEASE" "$GITHUB_SHA" main
            mkdir created-release
            gh release download "$GITHUB_REF_NAME" --pattern "${{ needs.verify.outputs.artifact-filename }}" --dir created-release
            node scripts/verify-release-integrity.mjs file "created-release/${{ needs.verify.outputs.artifact-filename }}" "$VANILLASKY_EXPECTED_INTEGRITY" "$VANILLASKY_EXPECTED_SHA256"
          fi
