name: Retire superseded npm package

on:
  workflow_dispatch:
    inputs:
      package_spec:
        description: Scoped VanillaSky npm package to retire
        required: true
        type: string
      replacement_package:
        description: Published replacement package
        required: true
        default: '@vanillaskyai/video'
        type: string
      confirmation:
        description: Type RETIRE to continue
        required: true
        type: string

permissions:
  contents: read

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Retire package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          PACKAGE_SPEC: ${{ inputs.package_spec }}
          REPLACEMENT_PACKAGE: ${{ inputs.replacement_package }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "RETIRE"
          test -n "$NPM_BOOTSTRAP_TOKEN"
          node --input-type=module -e '
            const [packageSpec, replacement] = process.argv.slice(1);
            const ownedPackage = /^@vanillaskyai\/[a-z0-9-]+$/;
            if (!ownedPackage.test(packageSpec) || !ownedPackage.test(replacement)) {
              throw new Error("Both packages must belong to the @vanillaskyai scope");
            }
            if (packageSpec === replacement) throw new Error("The package and its replacement must differ");
          ' "$PACKAGE_SPEC" "$REPLACEMENT_PACKAGE"

          if npm unpublish "$PACKAGE_SPEC" --force; then
            if npm view "$PACKAGE_SPEC" name >/dev/null 2>&1; then
              echo "The package is still visible after npm reported a successful unpublish." >&2
              exit 1
            fi
            echo "The package was unpublished."
          else
            echo "npm refused full deletion; deprecating every superseded version instead."
            npm deprecate "$PACKAGE_SPEC@*" "Package renamed to $REPLACEMENT_PACKAGE. Install $REPLACEMENT_PACKAGE instead."
            metadata=$(npm view "$PACKAGE_SPEC" name version deprecated --json)
            printf '%s' "$metadata" | node --input-type=module -e '
              const [expectedPackage, replacement] = process.argv.slice(1);
              const chunks = [];
              for await (const chunk of process.stdin) chunks.push(chunk);
              const metadata = JSON.parse(Buffer.concat(chunks).toString());
              if (metadata.name !== expectedPackage) throw new Error("Unexpected package metadata");
              if (!String(metadata.deprecated ?? "").includes(replacement)) {
                throw new Error("The package was not deprecated with the replacement name");
              }
            ' "$PACKAGE_SPEC" "$REPLACEMENT_PACKAGE"
            echo "Every superseded version now points to $REPLACEMENT_PACKAGE."
          fi
