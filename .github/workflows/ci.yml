name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install the locked npm CLI
        run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run registry:check
      # Exercise clean copies with the literal commands and dependency specs in their READMEs.
      - run: npx playwright install chromium
      - run: npm run examples:verify-documented
      # Separately exercise the locally packed release candidate.
      - run: npm run examples:install-current
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run acceptance:replay
      - run: npm run build
      # Packed verification reuses Chromium installed for documented examples.
      - run: npm run verify:package
      - run: npm run verify:package-size
      - run: npm run verify:onboarding
      - run: npm run verify:nextjs
      - run: npm audit --audit-level=low
      - run: npm pack --dry-run
      - run: npm run example:build
      - run: npm run server-examples:typecheck

  node-compatibility:
    strategy:
      matrix:
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install the locked npm CLI
        run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm test
      - run: npm run build

  react-compatibility:
    strategy:
      matrix:
        react: [18, 19]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install the locked npm CLI
        run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm install --no-save --package-lock=false react@${{ matrix.react }} react-dom@${{ matrix.react }}
      - run: npm test -- tests/react.test.tsx tests/player.test.tsx tests/template-kit.test.tsx tests/templates.test.tsx

  browser-compatibility:
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install the locked npm CLI
        run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run build
      - run: npm run examples:install-current
      - if: matrix.browser == 'chromium'
        run: npx playwright install chromium
      - if: matrix.browser != 'chromium'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }}
