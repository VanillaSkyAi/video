name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install the locked npm CLI
        run: npm install --global npm@11.17.0
      - run: npm ci
      - name: Verify pull request changeset
        if: github.event_name == 'pull_request'
        env:
          CHANGESET_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          npm run changeset:status
          npm run changeset:check
      - run: npm run registry:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run acceptance:replay
      - run: npm run build
      - run: npm run verify:package-size
      - run: npm audit --audit-level=low
      - run: npm pack --dry-run

  consumer-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install the locked npm CLI
        run: npm install --global npm@11.17.0
      - run: npm ci
      # Exercise clean copies with the literal commands and dependency specs in their READMEs.
      - run: npx playwright install chromium
      - run: npm run examples:verify-documented
      # Separately exercise the locally packed release candidate and ownership path.
      - run: npm run verify:api
      - run: npm run verify:package
      - run: npm run verify:onboarding
      - run: npm run examples:install-current
      - run: npm run example:build
      - run: npm run server-examples:typecheck

  provider-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install the locked npm CLI
        run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run verify:nextjs

  node-compatibility:
    strategy:
      matrix:
        # The primary verify job covers Node 22.
        node: [20, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install the locked npm CLI
        run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm test
      - run: npm run build

  react-compatibility:
    strategy:
      matrix:
        # The primary verify job uses the locked React 19 dependency.
        react: [18]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install the locked npm CLI
        run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm install --no-save --package-lock=false react@${{ matrix.react }} react-dom@${{ matrix.react }}
      - run: npm test -- tests/react.test.tsx tests/player.test.tsx tests/template-kit.test.tsx tests/templates.test.tsx

  browser-compatibility:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
      options: --ipc=host --user pwuser
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install the locked npm CLI
        run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run examples:install-current
      - run: npx playwright test
