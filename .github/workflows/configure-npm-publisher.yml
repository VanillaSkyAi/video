name: Configure npm trusted publisher

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CONFIGURE to create the @vanillaskyai/video OIDC publisher
        required: true
        type: string

permissions: {}

jobs:
  configure:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Install the locked npm CLI
        run: npm install --global npm@11.17.0
      - name: Configure and verify trusted publishing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "CONFIGURE"
          test -n "$NODE_AUTH_TOKEN"
          npm trust github @vanillaskyai/video \
            --file release.yml \
            --repo VanillaSkyAi/video \
            --env npm \
            --allow-publish \
            --yes
          trust=$(npm trust list @vanillaskyai/video --json)
          printf '%s' "$trust" | node --input-type=module -e '
            const chunks = [];
            for await (const chunk of process.stdin) chunks.push(chunk);
            const source = Buffer.concat(chunks).toString();
            for (const marker of ["VanillaSkyAi/video", "release.yml", "npm"]) {
              if (!source.includes(marker)) throw new Error(`Trusted publisher is missing ${marker}`);
            }
          '
